[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merger-transformer"
version = "0.2.1"
description = "Differentiable Transformer inference for precessing binary black-hole merger modes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jameson Dong"}]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
plot = ["numpy>=1.24", "matplotlib>=3.7"]
compile = ["torch>=2.12,<2.13"]
test = ["pytest>=7", "numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

