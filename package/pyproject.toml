[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merger-transformer"
version = "0.4.0"
description = "Differentiable black-hole merger waveforms and local private-NR fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jameson Dong"}]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
finetune = ["numpy>=1.24"]
plot = ["numpy>=1.24", "matplotlib>=3.7"]
compile = ["torch>=2.12,<2.13"]
test = ["pytest>=7", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
merger-transformer-finetune = "merger_transformer.finetune:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
